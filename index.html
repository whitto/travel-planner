<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Travel Planner</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple.png">
<link rel="icon" href="./icons/192.png">
<link rel="stylesheet" href="./styles.css">
<script defer src="./vendor/xlsx.min.js"></script>
<script defer src="./itinerary.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header><div class="wrap">
<p class="brand">✈ <span>MY TRAVEL PLANNER</span></p>
<h1 id="title">Travel Planner</h1>
<p id="subtitle">Your entire journey in one place</p>
<div id="stats"></div>
</div></header>
<main class="wrap">
<p id="notice" role="status" hidden></p>
<section id="welcome" class="card" hidden>
<h2>Open your itinerary</h2>
<p>Choose a single-sheet Excel workbook. Use the first row for headings and column A for dates.</p>
<button class="primary" data-action="choose">Choose Excel file</button>
<button data-action="restore">Restore backup</button>
<p class="hint">Your itinerary stays in this browser on this device.</p>
</section>
<section id="planner" hidden>
<h2 id="view-title"></h2>
<div id="controls">
<label for="search">Search <span id="search-view"></span></label>
<input id="search" type="search" placeholder="Search names, places or details">
<div id="filters" aria-label="Category"></div>
</div>
<div id="content"></div>
</section>
<input id="excel" type="file" accept=".xls,.xlsx" hidden>
<input id="backup" type="file" accept=".json,application/json" hidden>
</main>
<nav aria-label="Main navigation" hidden><div class="wrap" id="tabs"></div></nav>
</body>
</html>
